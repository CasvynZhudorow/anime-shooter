name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      
      - name: Build Release AAB
        run: ./gradlew :android:bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        timeout-minutes: 15
      
      - name: Verify AAB
        run: |
          ls -la android/build/outputs/bundle/release/
          AAB_PATH=$(find android/build/outputs/bundle/release -name "*.aab" | head -1)
          echo "AAB_PATH=$AAB_PATH" >> $GITHUB_ENV
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: env.AAB_PATH != ''
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Anime Shooter ${{ github.ref_name }}
            
            ### Changes
            - Built from commit ${{ github.sha }}
            
            ### Installation
            Download the `.aab` file below and install via:
            ```bash
            bundletool install --bundle=anime-shooter.aab
            ```
            Or upload to Google Play Console.
            
            ### Requirements
            - Android API 21+ (Android 5.0 Lollipop)
            - OpenGL ES 2.0+
            - ~50MB storage
          draft: false
          prerelease: false
          files: |
            ${{ env.AAB_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}